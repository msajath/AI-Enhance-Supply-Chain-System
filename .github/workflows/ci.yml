name: Qorvenz CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qorvenz_user
          POSTGRES_PASSWORD: qorvenz_dev_secret_2026
          POSTGRES_DB: qorvenz_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: qorvenz_user
      DB_PASSWORD: qorvenz_dev_secret_2026
      DB_NAME: qorvenz_db
      DB_SSL: false
      JWT_SECRET: qorvenz_ci_test_jwt_secret_key_1234567890_abcdef
      VITE_API_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Check TypeScript Compilation
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Execute Database Migrations
        run: npm run db:migrate

      - name: Run Automated Tests
        run: npm run test

      - name: Build Web & API Artifacts
        run: npm run build
